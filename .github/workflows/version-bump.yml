name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.1.0)"
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Ensure on modified
        run: |
          if [ "$GITHUB_REF" != "refs/heads/modified" ]; then
            echo "version-bump must run on modified, got $GITHUB_REF"
            exit 1
          fi
          
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format. Expected x.y.z (e.g. 1.1.0)"
            exit 1
          fi

      - name: Update version files
        run: |
          VERSION="${{ inputs.version }}"

          jq --arg v "$VERSION" '.version = $v' manifest.json > tmp.json && mv tmp.json manifest.json

      - name: Commit and push tag
        run: |
          VERSION="${{ inputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add manifest.json
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          git push
          git push origin "$VERSION"
